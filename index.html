<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>FounderFreeList — Verified $0 Startup Credits, Grants & Pitch Vault (2026)</title>
<meta name="description" content="Free verified directory of 33 solo-friendly startup credits, non-repayable cash micro-grants, country/LLC rules, and 150-word pitch templates.">
<style>
:root{--bg:#060913;--card:#0f1629;--border:#1e293b;--text:#f8fafc;--muted:#94a3b8;--emerald:#10b981;--cyan:#38bdf8;--amber:#f59e0b}
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,-apple-system,sans-serif}
body{background:var(--bg);color:var(--text);line-height:1.55;background-image:linear-gradient(rgba(56,189,248,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(56,189,248,.04) 1px,transparent 1px);background-size:32px 32px;overflow-x:hidden}
.wrap{max-width:1020px;margin:auto;padding:16px}
@keyframes pulseGlow{0%,100%{opacity:.45;transform:scale(1)}50%{opacity:.8;transform:scale(1.08)}}
@keyframes slideUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
.hero{position:relative;text-align:center;padding:44px 14px 28px;animation:slideUp .6s ease}
.glow{position:absolute;top:10px;left:50%;width:280px;height:160px;margin-left:-140px;background:radial-gradient(circle,rgba(16,185,129,.28),rgba(56,189,248,.12),transparent 70%);filter:blur(28px);z-index:-1;animation:pulseGlow 5s infinite ease-in-out}
.badge{display:inline-flex;align-items:center;gap:6px;background:rgba(16,185,129,.12);border:1px solid rgba(16,185,129,.3);color:var(--emerald);padding:5px 14px;border-radius:99px;font-size:12px;font-weight:700;margin-bottom:14px}
h1{font-size:clamp(26px,5.5vw,44px);font-weight:800;letter-spacing:-.8px;line-height:1.15;margin-bottom:12px;background:linear-gradient(90deg,#fff,#bae6fd,#6ee7b7);-webkit-background-clip:text;color:transparent}
.sub{color:var(--muted);max-width:640px;margin:0 auto 22px;font-size:15px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:560px;margin:0 auto 26px}
.stat{background:rgba(15,22,41,.85);border:1px solid var(--border);padding:12px 8px;border-radius:12px;backdrop-filter:blur(8px)}
.stat b{display:block;font-size:20px;color:var(--emerald)}
.stat span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
.bar{display:flex;flex-direction:column;gap:12px;margin-bottom:22px;background:rgba(15,22,41,.9);padding:14px;border-radius:14px;border:1px solid var(--border)}
.search{width:100%;background:#060913;border:1px solid var(--border);color:var(--text);padding:11px 14px;border-radius:10px;font-size:14px;outline:none;transition:.2s}
.search:focus{border-color:var(--cyan);box-shadow:0 0 0 3px rgba(56,189,248,.15)}
.tabs{display:flex;flex-wrap:wrap;gap:8px}
.tab{background:#131c31;color:var(--muted);border:1px solid var(--border);padding:7px 13px;border-radius:8px;font-size:12.5px;font-weight:600;cursor:pointer;transition:.2s}
.tab.active,.tab:hover{background:var(--emerald);color:#04130d;border-color:var(--emerald)}
</style>
